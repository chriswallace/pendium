  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 <div> <p class=\"position__statement\">\nMost small businesses are sitting on hours of <em>recoverable time<\u002Fem> every week.\n<span class=\"dim\">The technology to reclaim it is available and affordable. What's missing is\nsomeone with the judgment to deploy it against your actual workflows — <\u002Fspan>and the discipline to make\nyour team actually use what gets built.\n<\u002Fp> <div class=\"position__hr\"> <div class=\"stat\"> <b>2 wk<\u002Fb> <span>Discovery sprint<\u002Fspan> <\u002Fdiv> <div class=\"stat\"> <b>6–16 wk<\u002Fb> <span>Project engagements<\u002Fspan> <\u002Fdiv> <div class=\"stat\"> <b>3 mo+<\u002Fb> <span>Embedded retainer<\u002Fspan> <\u002Fdiv> <\u002Fdiv> <\u002Fdiv> <\u002Fsection> <section class=\"services\" id=\"services\"> <header class=\"section-head\"> <div class=\"label\">[ 03 / <b>Services<\u002Fb> ]<\u002Fdiv> <div class=\"meta\">Three lines · Sold standalone, compound when combined<\u002Fdiv> <\u002Fheader> <article class=\"service reveal\"> <div class=\"service__num\">A · 01<\u002Fdiv> <div class=\"service__copy\"> <h3 class=\"service__title\">Customer &amp; team<br><em>automation.<\u002Fem><\u002Fh3> <p class=\"service__lede\">\nAI systems that handle customer inquiries, triage support tickets, and\nrespond to internal requests — 24 hours a day, without adding headcount.\nTreated as a product with a real user experience, not a chatbot bolted onto a form.\n<\u002Fp> <ul class=\"service__deliverables\"> <li>Customer-facing chatbots<\u002Fli> <li>Email &amp; ticket responders<\u002Fli> <li>Escalation logic<\u002Fli> <li>Internal help desks<\u002Fli> <li>HR FAQ automation<\u002Fli> <li>Lead qualification<\u002Fli> <li>Follow-up sequences<\u002Fli> <li>CRM &amp; Slack integration<\u002Fli> <\u002Ful> <\u002Fdiv> <aside class=\"service__meta\"> <div class=\"service__meta-row\"> <div class=\"label\">Discovery sprint<b>Audit, opportunity map, roadmap<\u002Fb><\u002Fdiv> <div class=\"price\">$8 – $15K<\u002Fdiv> <\u002Fdiv> <div class=\"service__meta-row\"> <div class=\"label\">Project<b>Design, build, integration, handoff<\u002Fb><\u002Fdiv> <div class=\"price\">$15 – $50K<\u002Fdiv> <\u002Fdiv> <div class=\"service__meta-row\"> <div class=\"label\">Retainer<b>Iteration, expansion, monitoring<\u002Fb><\u002Fdiv> <div class=\"price\">$4 – $10K /mo<\u002Fdiv> <\u002Fdiv> <\u002Faside> <\u002Farticle> <article class=\"service reveal\"> <div class=\"service__num\">B · 02<\u002Fdiv> <div class=\"service__copy\"> <h3 class=\"service__title\">Knowledge<br><em>systems.<\u002Fem><\u002Fh3> <p class=\"service__lede\">\nYour team’s expertise, made findable and permanent. We turn scattered\ndocuments, SOPs, and tribal knowledge into an AI-powered resource anyone\ncan query in plain English — so expertise stops walking out the door\nwhen people leave.\n<\u002Fp> <ul class=\"service__deliverables\"> <li>Knowledge audit &amp; structure<\u002Fli> <li>SOP digitization<\u002Fli> <li>AI search over your docs<\u002Fli> <li>Google Drive / Notion / SharePoint<\u002Fli> <li>Slack Q&amp;A bots<\u002Fli> <li>Onboarding acceleration<\u002Fli> <li>Freshness policy<\u002Fli> <li>Governance model<\u002Fli> <\u002Ful> <\u002Fdiv> <aside class=\"service__meta\"> <div class=\"service__meta-row\"> <div class=\"label\">Discovery sprint<b>Audit, taxonomy, architecture<\u002Fb><\u002Fdiv> <div class=\"price\">$8 – $15K<\u002Fdiv> <\u002Fdiv> <div class=\"service__meta-row\"> <div class=\"label\">Project<b>Pipeline, interface, governance<\u002Fb><\u002Fdiv> <div class=\"price\">$20 – $60K<\u002Fdiv> <\u002Fdiv> <div class=\"service__meta-row\"> <div class=\"label\">Retainer<b>Ingestion, monitoring, expansion<\u002Fb><\u002Fdiv> <div class=\"price\">$4 – $12K /mo<\u002Fdiv> <\u002Fdiv> <\u002Faside> <\u002Farticle> <article class=\"service reveal\"> <div class=\"service__num\">C · 03<\u002Fdiv> <div class=\"service__copy\"> <h3 class=\"service__title\">Workflow<br><em>automation.<\u002Fem><\u002Fh3> <p class=\"service__lede\">\nWe map where your team’s time goes and build automation that bridges\nthe gaps — between apps, between departments, between what needs to\nhappen and when it actually gets done. Connects tools you already use\nwithout replacing your stack.\n<\u002Fp> <ul class=\"service__deliverables\"> <li>Workflow mapping &amp; ROI analysis<\u002Fli> <li>Invoice &amp; document processing<\u002Fli> <li>Report generation<\u002Fli> <li>Cross-tool data sync<\u002Fli> <li>Scheduling &amp; intake forms<\u002Fli> <li>Approval workflows<\u002Fli> <li>Adoption support<\u002Fli> <li>Training<\u002Fli> <\u002Ful> <\u002Fdiv> <aside class=\"service__meta\"> <div class=\"service__meta-row\"> <div class=\"label\">Audit<b>Workflow map, ROI targets<\u002Fb><\u002Fdiv> <div class=\"price\">$5 – $10K<\u002Fdiv> <\u002Fdiv> <div class=\"service__meta-row\"> <div class=\"label\">Project<b>Pipeline build, integration, rollout<\u002Fb><\u002Fdiv> <div class=\"price\">$15 – $50K<\u002Fdiv> <\u002Fdiv> <div class=\"service__meta-row\"> <div class=\"label\">Retainer<b>Maintenance, new builds, training<\u002Fb><\u002Fdiv> <div class=\"price\">$4 – $10K /mo<\u002Fdiv> <\u002Fdiv> <\u002Faside> <\u002Farticle> <\u002Fsection> <section class=\"verticals\" id=\"verticals\"> <div class=\"verticals__head\"> <h2 class=\"verticals__title\">We know your<br><em>industry.<\u002Fem><\u002Fh2> <div class=\"verticals__count\">[ 04 / 08 industries · Hover to expand ]<\u002Fdiv> <\u002Fdiv> <div class=\"verticals__list\"> <div class=\"vertical\"> <div class=\"vertical__num\">VR — 01<\u002Fdiv> <div> <div class=\"vertical__name\">Professional Services<\u002Fdiv> <div class=\"vertical__detail\"><div class=\"vertical__detail-inner\">Teams fielding the same client questions daily, proposals assembled from scratch, project updates sent manually. We automate client intake, FAQ response, and proposal generation so billable hours stay billable.<\u002Fdiv><\u002Fdiv> <\u002Fdiv> <div class=\"vertical__tags\">Client intake · Proposal automation · Status updates<\u002Fdiv> <\u002Fdiv> <div class=\"vertical\"> <div class=\"vertical__num\">VR — 02<\u002Fdiv> <div> <div class=\"vertical__name\">Healthcare &amp; Wellness<\u002Fdiv> <div class=\"vertical__detail\"><div class=\"vertical__detail-inner\">Front desks overwhelmed with intake calls and appointment questions, staff knowledge locked in people’s heads. Patient FAQ automation, appointment routing, and internal knowledge systems — built with privacy in mind.<\u002Fdiv><\u002Fdiv> <\u002Fdiv> <div class=\"vertical__tags\">Patient FAQ · Appointment routing · Staff knowledge<\u002Fdiv> <\u002Fdiv> <div class=\"vertical\"> <div class=\"vertical__num\">VR — 03<\u002Fdiv> <div> <div class=\"vertical__name\">Legal<\u002Fdiv> <div class=\"vertical__detail\"><div class=\"vertical__detail-inner\">Decades of matter files invisible, attorneys as the search engine. Document intelligence with citation tracking, client Q&amp;A automation, and knowledge bases that let associates find answers without interrupting partners.<\u002Fdiv><\u002Fdiv> <\u002Fdiv> <div class=\"vertical__tags\">Matter knowledge · Client Q&amp;A · Document review<\u002Fdiv> <\u002Fdiv> <div class=\"vertical\"> <div class=\"vertical__num\">VR — 04<\u002Fdiv> <div> <div class=\"vertical__name\">Real Estate<\u002Fdiv> <div class=\"vertical__detail\"><div class=\"vertical__detail-inner\">Leads going cold waiting for responses, listing questions answered one at a time, transaction documents processed by hand. AI that qualifies leads, answers listing Q&amp;A, and handles document extraction so agents focus on closing.<\u002Fdiv><\u002Fdiv> <\u002Fdiv> <div class=\"vertical__tags\">Lead qualification · Listing Q&amp;A · Document processing<\u002Fdiv> <\u002Fdiv> <div class=\"vertical\"> <div class=\"vertical__num\">VR — 05<\u002Fdiv> <div> <div class=\"vertical__name\">Retail &amp; E-commerce<\u002Fdiv> <div class=\"vertical__detail\"><div class=\"vertical__detail-inner\">Order inquiries flooding inboxes, returns handled manually, inventory reports assembled by hand. We automate customer-facing support, returns triage, and scheduled reporting so your team focuses on growth.<\u002Fdiv><\u002Fdiv> <\u002Fdiv> <div class=\"vertical__tags\">Order support · Returns automation · Reporting<\u002Fdiv> <\u002Fdiv> <div class=\"vertical\"> <div class=\"vertical__num\">VR — 06<\u002Fdiv> <div> <div class=\"vertical__name\">Financial Services<\u002Fdiv> <div class=\"vertical__detail\"><div class=\"vertical__detail-inner\">Advisors spending mornings on data aggregation, compliance teams drafting from scratch, client onboarding taking weeks. Client onboarding automation, report generation, and compliance knowledge systems — built for regulated environments.<\u002Fdiv><\u002Fdiv> <\u002Fdiv> <div class=\"vertical__tags\">Onboarding · Report generation · Compliance<\u002Fdiv> <\u002Fdiv> <div class=\"vertical\"> <div class=\"vertical__num\">VR — 07<\u002Fdiv> <div> <div class=\"vertical__name\">Agencies<\u002Fdiv> <div class=\"vertical__detail\"><div class=\"vertical__detail-inner\">Account managers context-switching across a dozen clients, new hires taking months to ramp, briefs assembled from memory. Brief intake automation, client status updates, and internal knowledge systems that get new staff productive fast.<\u002Fdiv><\u002Fdiv> <\u002Fdiv> <div class=\"vertical__tags\">Brief intake · Status updates · Onboarding<\u002Fdiv> <\u002Fdiv> <div class=\"vertical\"> <div class=\"vertical__num\">VR — 08<\u002Fdiv> <div> <div class=\"vertical__name\">Hospitality<\u002Fdiv> <div class=\"vertical__detail\"><div class=\"vertical__detail-inner\">Guest inquiries arriving around the clock, staff knowledge inconsistent across shifts, booking workflows handled manually. Guest Q&amp;A automation, staff knowledge systems, and booking workflow integration without adding headcount.<\u002Fdiv><\u002Fdiv> <\u002Fdiv> <div class=\"vertical__tags\">Guest Q&amp;A · Staff knowledge · Booking workflows<\u002Fdiv> <\u002Fdiv> <\u002Fdiv> <\u002Fsection> <section class=\"cases\" id=\"work\"> <div class=\"cases__head\"> <h2 class=\"cases__title\">What it looks<br><em>like in practice.<\u002Fem><\u002Fh2> <p class=\"cases__lede\">\nIllustrative examples — the shape and scale of typical Pendium engagements. Specific clients on request.\n<\u002Fp> <\u002Fdiv> <div class=\"cases__grid\"> <article class=\"case reveal\"> <div class=\"case__media case__media--gradient\"> <div class=\"case__media-meta\"> <span class=\"chip\">Case 001<\u002Fspan> <span class=\"chip\">Professional Services<\u002Fspan> <span class=\"chip\">6 weeks<\u002Fspan> <\u002Fdiv> <div class=\"case__media-label\"><span class=\"ph\">Product capture · 1600 × 1000<\u002Fspan><\u002Fdiv> <\u002Fdiv> <div class=\"case__head\"> <span>Accounting firm · 28 staff<\u002Fspan> <span>2026<\u002Fspan> <\u002Fdiv> <h3 class=\"case__title\">Client Q&amp;A automation for an <em>accounting firm.<\u002Fem><\u002Fh3> <p class=\"case__lede\">\nAI assistant trained on the firm’s service catalog, FAQ, and two years of client email threads. Deployed on the website and client portal — answers routine questions instantly, routes complex ones to the right advisor.\n<\u002Fp> <div class=\"case__metrics\"> <div class=\"m\"><b>70%<\u002Fb><span>Inquiries automated<\u002Fspan><\u002Fdiv> <div class=\"m\"><b>12 hr<\u002Fb><span>Reclaimed weekly<\u002Fspan><\u002Fdiv> <div class=\"m\"><b>↓ 24 hr<\u002Fb><span>Response time<\u002Fspan><\u002Fdiv> <\u002Fdiv> <\u002Farticle> <article class=\"case reveal\"> <div class=\"case__media\"> <div class=\"case__media-meta\"> <span class=\"chip\">Case 002<\u002Fspan> <span class=\"chip\">Legal<\u002Fspan> <span class=\"chip\">10 weeks<\u002Fspan> <\u002Fdiv> <div class=\"case__media-label\"><span class=\"ph\">Editorial UI · 1600 × 1000<\u002Fspan><\u002Fdiv> <\u002Fdiv> <div class=\"case__head\"> <span>Boutique law firm · 18 attorneys<\u002Fspan> <span>2025<\u002Fspan> <\u002Fdiv> <h3 class=\"case__title\">Matter knowledge system for a <em>boutique law firm.<\u002Fem><\u002Fh3> <p class=\"case__lede\">\nA decade of briefs, memos, and correspondence made AI-searchable with citation tracking. Associates find what they need in seconds — with a source document and page number attached to every answer.\n<\u002Fp> <div class=\"case__metrics\"> <div class=\"m\"><b>↑35%<\u002Fb><span>Research time<\u002Fspan><\u002Fdiv> <div class=\"m\"><b>10 yr<\u002Fb><span>Files indexed<\u002Fspan><\u002Fdiv> <div class=\"m\"><b>1:1<\u002Fb><span>Citation grounding<\u002Fspan><\u002Fdiv> <\u002Fdiv> <\u002Farticle> <article class=\"case reveal\"> <div class=\"case__media case__media--gradient\"> <div class=\"case__media-meta\"> <span class=\"chip\">Case 003<\u002Fspan> <span class=\"chip\">Retail &amp; E-commerce<\u002Fspan> <span class=\"chip\">4 weeks<\u002Fspan> <\u002Fdiv> <div class=\"case__media-label\"><span class=\"ph\">Search interface · 1600 × 1000<\u002Fspan><\u002Fdiv> <\u002Fdiv> <div class=\"case__head\"> <span>D2C apparel brand · 14 staff<\u002Fspan> <span>2025<\u002Fspan> <\u002Fdiv> <h3 class=\"case__title\">Order support automation for a <em>D2C brand.<\u002Fem><\u002Fh3> <p class=\"case__lede\">\nAI assistant handling order status, returns, and product questions via email and website chat. Integrated with Shopify and the client’s helpdesk. Deployed in four weeks, fully owned by the client team.\n<\u002Fp> <div class=\"case__metrics\"> <div class=\"m\"><b>↓35%<\u002Fb><span>Research time<\u002Fspan><\u002Fdiv> <div class=\"m\"><b>10 yr<\u002Fb><span>Files indexed<\u002Fspan><\u002Fdiv> <div class=\"m\"><b>1:1<\u002Fb><span>Citation grounding<\u002Fspan><\u002Fdiv> <\u002Fdiv> <\u002Farticle> <article class=\"case reveal\"> <div class=\"case__media\"> <div class=\"case__media-meta\"> <span class=\"chip\">Case 004<\u002Fspan> <span class=\"chip\">Healthcare<\u002Fspan> <span class=\"chip\">8 weeks<\u002Fspan> <\u002Fdiv> <div class=\"case__media-label\"><span class=\"ph\">Pipeline diagram · 1600 × 1000<\u002Fspan><\u002Fdiv> <\u002Fdiv> <div class=\"case__head\"> <span>Physical therapy group · 6 locations<\u002Fspan> <span>2025<\u002Fspan> <\u002Fdiv> <h3 class=\"case__title\">Staff knowledge system for a <em>PT group.<\u002Fem><\u002Fh3> <p class=\"case__lede\">\nInternal knowledge base covering treatment protocols, intake procedures, insurance FAQs, and onboarding guides — queryable in plain English. New staff now productive in days, not weeks.\n<\u002Fp> <div class=\"case__metrics\"> <div class=\"m\"><b>↑60%<\u002Fb><span>Onboarding time<\u002Fspan><\u002Fdiv> <div class=\"m\"><b>6 sites<\u002Fb><span>Unified knowledge<\u002Fspan><\u002Fdiv> <div class=\"m\"><b>100%<\u002Fb><span>Client-owned<\u002Fspan><\u002Fdiv> <\u002Fdiv> <\u002Farticle> <\u002Fdiv> <\u002Fsection> <section class=\"engagements\" id=\"engagements\"> <header class=\"section-head\"> <div class=\"label\">[ 06 / <b>Engagement shapes<\u002Fb> ]<\u002Fdiv> <div class=\"meta\">Four ways to work · Most engagements start with a sprint<\u002Fdiv> <\u002Fheader> <h2 class=\"engagements__title\">Four ways<br>to <em>get started.<\u002Fem><\u002Fh2> <div class=\"engagements__grid\"> <div class=\"engagement\"> <div class=\"engagement__num\">01 · Sprint<\u002Fdiv> <h4 class=\"engagement__name\">Discovery Sprint<\u002Fh4> <div class=\"engagement__price\">$8 – $15K<small>2 weeks · fixed<\u002Fsmall><\u002Fdiv> <p class=\"engagement__copy\">Current-state audit of your operations, AI opportunity map, prioritized recommendations, and implementation roadmap. Most clients recoup the cost within 60 days.<\u002Fp> <div class=\"engagement__dur\">The right starting point for most clients<\u002Fdiv> <\u002Fdiv> <div class=\"engagement\"> <div class=\"engagement__num\">02 · Project<\u002Fdiv> <h4 class=\"engagement__name\">Project Engagement<\u002Fh4> <div class=\"engagement__price\">$25 – $120K<small>6–16 weeks · scoped<\u002Fsmall><\u002Fdiv> <p class=\"engagement__copy\">Defined scope, fixed outcome, production-ready system with handoff documentation and team training. You own everything at the end.<\u002Fp> <div class=\"engagement__dur\">For shipping a real thing<\u002Fdiv> <\u002Fdiv> <div class=\"engagement\"> <div class=\"engagement__num\">03 · Retainer<\u002Fdiv> <h4 class=\"engagement__name\">Embedded Retainer<\u002Fh4> <div class=\"engagement__price\">$8 – $25K /mo<small>3 month minimum<\u002Fsmall><\u002Fdiv> <p class=\"engagement__copy\">Pendium operates as a fractional AI implementation partner — iteration on what’s been built, new automation initiatives, maintenance, and strategic guidance.<\u002Fp> <div class=\"engagement__dur\">For a sustained capability partner<\u002Fdiv> <\u002Fdiv> <div class=\"engagement\"> <div class=\"engagement__num\">04 · Workshop<\u002Fdiv> <h4 class=\"engagement__name\">Workshop &amp; Training<\u002Fh4> <div class=\"engagement__price\">$3 – $8K<small>Half- or full-day<\u002Fsmall><\u002Fdiv> <p class=\"engagement__copy\">Half- or full-day session on AI adoption, automation strategy, or knowledge management. Builds your team’s capability to evaluate and run AI systems themselves.<\u002Fp> <div class=\"engagement__dur\">For teams building capability<\u002Fdiv> <\u002Fdiv> <\u002Fdiv> <\u002Fsection> <section class=\"founder\" id=\"founder\"> <header class=\"section-head\" style=\"border-top:0;padding-top:0;\"> <div class=\"label\">[ 07 / <b>Founder<\u002Fb> ]<\u002Fdiv> <div class=\"meta\">Solo principal · Direct delivery<\u002Fdiv> <\u002Fheader> <div class=\"founder__inner\"> <div class=\"founder__photo\"> <span class=\"ph\">Portrait · 1080 × 1280<\u002Fspan> <\u002Fdiv> <div class=\"founder__copy\"> <span class=\"founder__eyebrow\">Chris Wallace · Founder &amp; principal<\u002Fspan> <h3 class=\"founder__name\">\nClients work with the<br>\nperson who <em>designed<\u002Fem><br>\nthe system.\n<\u002Fh3> <p class=\"founder__bio\">\nChris leads and delivers every engagement — no project manager relay,\nno junior staff handed the work after the pitch. Trusted specialist\ncollaborators come in for integrations and data engineering as needed,\nkeeping delivery senior across the full surface area of every build.\n<\u002Fp> <ul class=\"founder__principles\"> <li>AI implementation is judgment, not just engineering.<\u002Fli> <li>Build around your workflow, not the other way around.<\u002Fli> <li>Most failure happens at the team handoff.<\u002Fli> <li>Good systems are boring — and quietly used for years.<\u002Fli> <\u002Ful> <\u002Fdiv> <\u002Fdiv> <\u002Fsection> <section class=\"contact\" id=\"contact\"> <div class=\"contact__eyebrow\">[ 08 / <b style=\"color:var(--fg);font-weight:400\">Get in touch<\u002Fb> ]<\u002Fdiv> <h2 class=\"contact__statement\">\nTell us where your team's time goes.<br>We'll tell you what <em>AI can actually do about it.<\u002Fem> <\u002Fh2> <a class=\"contact__email\" href=\"mailto:hello@pendium.co\">hello@pendium.co<\u002Fa> <p class=\"contact__sub\">\nWe come back with a written read of your situation, the moves we'd make,\nand what success looks like in 60 days. Replies within two working days.\nNo sales pitch — just a straight answer.\n<\u002Fp> <div class=\"contact__chips\"> <span class=\"pill\"><span class=\"dot\"><\u002Fspan> 2 project slots open<\u002Fspan> <span class=\"pill\">Fixed scope · Fixed price<\u002Fspan> <span class=\"pill\">You own everything we build<\u002Fspan> <\u002Fdiv> <\u002Fsection> <footer class=\"footer\"> <div><b>Pendium<\u002Fb>AI automation for small &amp; mid-size businesses<\u002Fdiv> <div><b>Services<\u002Fb>Customer automation · Knowledge systems · Workflow automation<\u002Fdiv> <div><b>Industries<\u002Fb>Professional services · Healthcare · Legal · Real estate · Retail · Finance<\u002Fdiv> <div><b>Contact<\u002Fb><a href=\"mailto:hello@pendium.co\">hello@pendium.co<\u002Fa><\u002Fdiv> <div class=\"footer__bottom\"> <span>© MMXXVI Pendium · Fixed scope. Fixed price. You own what we build.<\u
